{{- $isExternal := or (hasPrefix .Destination "http://") (hasPrefix .Destination "https://") -}}
<a href="{{ .Destination | safeURL }}"
   {{- if $isExternal }} target="_blank" rel="noopener noreferrer"{{- end }}
   {{- with .Title }} title="{{ . }}"{{- end }}
   class="text-accent hover:text-accent-hover transition-colors">
  {{- .Text | safeHTML -}}
  {{- if $isExternal -}}
    <svg class="inline-block w-3 h-3 ml-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h6v6"/>
      <path d="M10 14 21 3"/>
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    </svg>
  {{- end -}}
</a>

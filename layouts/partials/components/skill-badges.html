<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
  <!-- Hobbies Column -->
  <div class="space-y-4">
    <h3 class="text-lg font-semibold text-text-primary">Hobbies</h3>
    <div class="space-y-3">
      {{- range .Site.Data.skills.hobbies }}
      <div class="interest-item">
        <span class="interest-icon">{{ .emoji }}</span>
        <div class="interest-content">
          <span class="interest-title">{{ .title }}</span>
          <span class="interest-description">{{ .description }}</span>
        </div>
      </div>
      {{- end }}
    </div>
  </div>

  <!-- Skills Column -->
  <div class="space-y-4">
    <h3 class="text-lg font-semibold text-text-primary">Skills</h3>
    <div class="space-y-3">
      {{- range .Site.Data.skills.skills }}
      <div class="interest-content">
        <span class="interest-title">{{ .category }}</span>
        <ul class="skill-list">
          {{- range .items }}
          <li>{{ . }}</li>
          {{- end }}
        </ul>
      </div>
      {{- end }}
    </div>
  </div>
</div>

{{- /* Single page site - minimal header, only shown if menu exists */ -}}
{{- with .Site.Menus.main }}
<header class="w-full border-b border-gray-800">
  <div class="max-w-content mx-auto px-4 py-4">
    <nav class="flex items-center justify-end">
      <ul class="flex items-center gap-6">
        {{- range . }}
        <li>
          <a href="{{ .URL }}" class="text-gray-400 hover:text-accent transition-colors text-sm">
            {{ .Name }}
          </a>
        </li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
{{- end }}
